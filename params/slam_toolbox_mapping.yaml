# Reference slam_toolbox parameters for MAPPING mode.
#
# Runtime params are generated from Viam SLAM service attributes:
#   mode              -> slam_toolbox mode + node selection
#   slam_toolbox.*    -> common ROS params (see README)
#   slam_params       -> advanced overrides merged last
slam_toolbox:
  ros__parameters:
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    # Needed for slam_toolbox interactive / manual_loop_closure tooling in RViz.
    # The DoCommand ``optimize`` path uses serialize→deserialize instead.
    enable_interactive_mode: true
    resolution: 0.05
    transform_publish_period: 0.05
    map_update_interval: 1.0
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    max_laser_range: 25.0
    # When continuing an existing map, the module sets:
    #   map_file_name: <maps_dir>/<map>/map
    #   map_start_at_dock: true
